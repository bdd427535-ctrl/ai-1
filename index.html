<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dotty</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#world{position:relative;width:100vw;height:100vh;background:#000}
#dot{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:#f22;box-shadow:0 0 10px #f22,0 0 30px #f22,0 0 60px #f224;z-index:10}
.thinking{
  animation:glitchPulse .18s infinite steps(2),glitchFlash .32s infinite steps(2);
}
@keyframes glitchFlash{
  0%{
    background:#f22;
    box-shadow:0 0 10px #f22,0 0 30px #f22,0 0 60px #f224;
  }

  35%{
    background:#28f;
    box-shadow:0 0 5px #28f,0 0 20px #28f,0 0 70px #28f;
  }

  55%{
    background:#f22;
    box-shadow:0 0 20px #f22,0 0 45px #f22,0 0 80px #f224;
  }

  75%{
    opacity:.25;
  }

  80%{
    opacity:1;
  }

  100%{
    background:#28f;
  }
}

@keyframes glitchPulse{
  0%{
    transform:translate(-50%,-50%) scale(1);
  }

  20%{
    transform:translate(calc(-50% + 2px),-50%) scale(.8);
  }

  40%{
    transform:translate(calc(-50% - 3px),calc(-50% + 2px)) scale(1.25);
  }

  60%{
    transform:translate(-50%,calc(-50% - 2px)) scale(.65);
  }

  80%{
    transform:translate(calc(-50% + 3px),-50%) scale(1.1);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}
#answer{position:absolute;left:50%;top:50%;max-width:min(650px,65vw);font-size:clamp(17px,1.5vw,24px);line-height:1.55;opacity:0;pointer-events:none;z-index:8;text-shadow:0 0 12px #fff3}
#answer.show{animation:drift 2.8s ease-out forwards}@keyframes drift{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1)}}
#input{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 40px));display:flex;gap:10px;z-index:30}
#msg{flex:1;height:50px;border:1px solid #222;border-radius:25px;background:#080808;color:#fff;padding:0 20px;font-size:16px;outline:0}
#send{width:50px;height:50px;border:1px solid #333;border-radius:50%;background:#111;color:#fff;cursor:pointer}
.g{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  z-index:11;
  animation:go 6s ease-in-out forwards;
  filter:blur(2px);
}
@keyframes go{
  0%{left:var(--sx);top:var(--sy);opacity:0;transform:scale(.4)}
  8%{opacity:1}
  75%{opacity:1}
  90%{opacity:.9}
  100%{left:50%;top:50%;opacity:0;transform:scale(1.8)}
}
.shape{
  position:absolute;
  width:var(--s);
  height:var(--s);
  background:transparent;
  border:2px solid var(--c);
  box-shadow:0 0 4px var(--c),0 0 12px var(--c);
  animation:fly var(--d) ease-out forwards;
}

.circle{
  border-radius:50%;
}

.square{
  border-radius:0;
}

.triangle{
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
}

.star{
  clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 95%,
    50% 72%,
    21% 95%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}

.hexagon{
  clip-path:polygon(
    25% 0%,
    75% 0%,
    100% 50%,
    75% 100%,
    25% 100%,
    0% 50%
  );
}

@keyframes fly{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.1);
  }

  15%{
    opacity:1;
  }

  85%{
    opacity:1;
  }

  100%{
    left:var(--tx);
    top:var(--ty);
    opacity:0;
    transform:translate(-50%,-50%) rotate(var(--r)) scale(1);
  }
}
#status{position:absolute;left:50%;top:calc(50% + 35px);transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:#555;opacity:0}
  .switch-orb{
  position:absolute;
  right:-30px;
  top:50%;
  width:18px;
  height:18px;
  border-radius:50%;
  transform:translateY(-50%);
  z-index:20;
  animation:eatDot 2.8s ease-in-out forwards;
}

@keyframes eatDot{
  0%{
    right:-30px;
    transform:translateY(-50%) scale(.7);
    opacity:0;
  }

  15%{
    opacity:1;
  }

  70%{
    right:50%;
    transform:translate(50%,-50%) scale(1);
  }

  100%{
    right:50%;
    transform:translate(50%,-50%) scale(3);
    opacity:0;
  }
}
  #switchButton{
  position:fixed;
  right:25px;
  bottom:25px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid #b44cff;
  background:#5b16a8;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  z-index:50;
  box-shadow:0 0 10px #b44cff,0 0 30px #8a2be2,0 0 55px #8a2be288;
}
#status.on{opacity:1}
#lockScreen {
  position: fixed;
  inset: 0;
  background: white;
  color: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 9999;
  font-family: Arial, sans-serif;
}

#lockScreen h1 {
  margin: 0;
  font-size: 32px;
}

#codeInput {
  width: 260px;
  height: 44px;
  padding: 0 14px;
  border: 1px solid #aaa;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}

#codeButton {
  width: 100px;
  height: 40px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

#codeError {
  margin: 0;
  color: #d00;
  min-height: 18px;
}
</style>
</head>
<body><div id="lockScreen">
  <h1>Code Needed</h1>
  <input id="codeInput" type="password" placeholder="Enter password">
  <button id="codeButton">Enter</button>
  <p id="codeError"></p>
</div><div id="world"><div id="dot"></div><div id="status">THINKING</div><div id="answer"></div>
<form id="input"><input id="msg" placeholder="Talk to Dotty..." autocomplete="off"><button id="send">➜</button></form>
<button id="switchButton">●</button>
</div>
<script>
const w=document.getElementById('world'),dot=document.getElementById('dot'),msg=document.getElementById('msg'),answer=document.getElementById('answer'),status=document.getElementById('status'),switchButton=document.getElementById('switchButton')
let bubbleMode=false;
let switching=false;

switchButton.addEventListener('click',()=>{
  if(switching) return;
  switching=true;

  const targetBubble=!bubbleMode;
  const orb=document.createElement('div');

  orb.className='switch-orb';

  if(targetBubble){
    orb.style.background='#2080ff';
    orb.style.boxShadow='0 0 10px #2080ff,0 0 30px #2080ff,0 0 60px #2080ff66';
  }else{
    orb.style.background='#f22';
    orb.style.boxShadow='0 0 10px #f22,0 0 30px #f22,0 0 60px #f224';
  }

  w.appendChild(orb);

  setTimeout(()=>{
    bubbleMode=targetBubble;

    if(bubbleMode){
      dot.style.background='#2080ff';
      dot.style.boxShadow='0 0 10px #2080ff,0 0 30px #2080ff,0 0 60px #2080ff66';
      switchButton.style.background='#32105f';
    }else{
      dot.style.background='#f22';
      dot.style.boxShadow='0 0 10px #f22,0 0 30px #f22,0 0 60px #f224';
      switchButton.style.background='#5b16a8';
    }

    orb.remove();
    switching=false;
  },2800);
});
function clearAnswer(){answer.className='';answer.textContent=''}
msg.oninput=()=>{if(msg.value.trim())clearAnswer()};
function glope(){
  const glopColors=['#ff2020','#2080ff','#20ff70'];
  const c=glopColors[Math.random()*glopColors.length|0];
  const fromLeft=Math.random()<0.5;

  for(let i=0;i<35;i++){
    let e=document.createElement('div');
    e.className='g';
    e.style.background=c;
    e.style.boxShadow=`0 0 10px ${c},0 0 25px ${c},0 0 50px ${c}`;
    e.style.setProperty('--sx',fromLeft?`${-5+Math.random()*18}vw`:`${87+Math.random()*18}vw`);
    e.style.setProperty('--sy',`${-5+Math.random()*25}vh`);
    e.style.animationDelay=i*.12+'s';
    w.appendChild(e);
    setTimeout(()=>e.remove(),12000);
  }
}
function shapes(){
  const shapeTypes=['circle','square','triangle','star','hexagon'];
  const shapeColors=['#28ff88','#ffe04a','#c45cff','#38a8ff','#ff304f'];

  for(let i=0;i<5;i++){
    let e=document.createElement('div');

    let t=shapeTypes[Math.random()*shapeTypes.length|0];
    let c=shapeColors[Math.random()*shapeColors.length|0];

    e.className='shape '+t;

    e.style.setProperty('--c',c);
    e.style.setProperty('--s',18+Math.random()*42+'px');

    e.style.setProperty('--tx',Math.random()*100+'vw');
    e.style.setProperty('--ty',Math.random()*100+'vh');

    e.style.setProperty('--d','9s');

    e.style.setProperty(
      '--r',
      Math.random()*1440-720+'deg'
    );

    e.style.left='50%';
    e.style.top='50%';

    e.style.animationDelay=i*.25+'s';

    w.appendChild(e);

    setTimeout(()=>e.remove(),9500);
  }
}
function show(text){
  answer.textContent=text;
  answer.style.setProperty('--x',Math.random()*220-110+'px');
  answer.style.setProperty('--y',Math.random()*180-90+'px');
  answer.className='show';

  setTimeout(()=>{
    speechSynthesis.cancel();

    const voice=new SpeechSynthesisUtterance(text);
    voice.rate=1;
    voice.pitch=bubbleMode ? 0.85 : 1;
    voice.volume=1;

    speechSynthesis.speak(voice);
  },800);
}
async function ask(text){
  glope();

  await new Promise(resolve=>setTimeout(resolve,10000));

  dot.classList.add('thinking');
  dot.style.filter='contrast(1.8) brightness(1.5)';
  status.classList.add('on');

  try{
    let r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text,bubble:bubbleMode})
    });

    let d=await r.json();
    if(!r.ok)throw Error(d.error);

    await new Promise(resolve=>setTimeout(resolve,1200));

    status.classList.remove('on');
    dot.classList.remove('thinking');
    dot.style.filter='';
    
    shapes();

    setTimeout(()=>show(d.reply||'Dotty has nothing to say.'),700);

  }catch(e){
    status.classList.remove('on');
    dot.classList.remove('thinking');
    dot.style.filter='';

    shapes();

    setTimeout(()=>show('Something went wrong. Dotty blames the universe.'),700);
  }
}
document.getElementById('input').onsubmit=e=>{e.preventDefault();let t=msg.value.trim();if(!t)return;msg.value='';clearAnswer();ask(t)}
const lockScreen = document.getElementById("lockScreen");
const codeInput = document.getElementById("codeInput");
const codeButton = document.getElementById("codeButton");
const codeError = document.getElementById("codeError");

codeButton.addEventListener("click", () => {
  if (codeInput.value === "D0rian:)") {
    lockScreen.style.display = "none";
  } else {
    codeError.textContent = "Incorrect code.";
    codeInput.value = "";
    codeInput.focus();
  }
});

codeInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    codeButton.click();
  }
});</script></body></html>
